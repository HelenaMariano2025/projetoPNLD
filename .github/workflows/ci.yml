name: CI/CD - Testes, Qualidade, SonarQube e Deploy

on:
  push:
    branches:
      - main
      - "task/**"
      - "feat/**"
      - "infra/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: 1. CI - Testes e análise de qualidade
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_local
          MYSQL_DATABASE: SistemaHBL
          MYSQL_USER: pnld
          MYSQL_PASSWORD: pnld_local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mysqli, pdo_mysql, mbstring, dom, xml, xmlwriter
          coverage: xdebug
          tools: composer:v2

      - name: Cache das dependências do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist

      - name: Verificar sintaxe PHP
        run: |
          find . -maxdepth 2 -name "*.php" -not -path "./vendor/*" -print0 |
            xargs -0 -n1 php -l
          find php tests tests-e2e -type f -name "*.php" -print0 |
            xargs -0 -n1 php -l

      - name: Executar análise estática
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress

      - name: Preparar banco de testes
        env:
          MYSQL_PWD: pnld_local
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -u pnld SistemaHBL < sql/bancoPNLD.sql

      - name: Executar testes e gerar cobertura
        env:
          XDEBUG_MODE: coverage
          DB_HOST: 127.0.0.1
          DB_USER: pnld
          DB_PASSWORD: pnld_local
          DB_NAME: SistemaHBL
        run: |
          vendor/bin/phpunit --configuration phpunit.xml \
            --coverage-text \
            --coverage-clover coverage.xml

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Enviar análise para o SonarQube
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://labens.dct.ufrn.br/sonarqube' }}

  cd:
    name: 2. CD - Deploy Contínuo em Nuvem
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Disparar Deploy Automatizado (Render Deploy Hook)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Disparando deploy na nuvem via Webhook seguro..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "Aviso: RENDER_DEPLOY_HOOK não configurado em GitHub Secrets."
          fi

  smoke-tests:
    name: 3. Smoke Testing Pós-Deploy (/health)
    needs: cd
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Validar Endpoint de Integridade (/health)
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "Aviso: APP_BASE_URL não configurado em GitHub Secrets. Pulando teste de fumaça."
            exit 0
          fi
          URL="${APP_BASE_URL}/health"
          echo "Aguardando estabilização da aplicação em: $URL"
          sleep 25
          SUCCESS=false
          for i in {1..10}; do
            echo "Tentativa $i: requisitando $URL..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Código HTTP retornado: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test aprovado: Aplicação operacional e respondendo status 200 OK!"
              SUCCESS=true
              break
            fi
            sleep 10
          done
          if [ "$SUCCESS" = false ]; then
            echo "Falha no Smoke Test: Endpoint de integridade não respondeu HTTP 200."
            exit 1
          fi
