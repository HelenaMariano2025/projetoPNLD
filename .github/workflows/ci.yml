name: CI - Testes e Qualidade

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Testes e análise de qualidade
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_local
          MYSQL_DATABASE: SistemaHBL
          MYSQL_USER: pnld
          MYSQL_PASSWORD: pnld_local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u pnld -ppnld_local"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, xdebug
          coverage: xdebug

      - name: Cache das dependências do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist

      - name: Verificar sintaxe PHP
        run: |
          find php tests -type f -name "*.php" -print0 |
            xargs -0 -n1 php -l

      - name: Executar análise estática
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress

      - name: Preparar banco de testes
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -u pnld -ppnld_local SistemaHBL < sql/bancoPNLD.sql

      - name: Executar testes e gerar cobertura
        env:
          XDEBUG_MODE: coverage
          DB_HOST: 127.0.0.1
          DB_USER: pnld
          DB_PASSWORD: pnld_local
          DB_NAME: SistemaHBL
        run: |
          vendor/bin/phpunit \
            --coverage-text \
            --coverage-clover coverage.xml

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore