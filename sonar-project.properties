sonar.host.url=http://labens.dct.ufrn.br/sonarqube
sonar.projectKey=pnldkey
sonar.projectName=Projeto PNLD
sonar.projectVersion=0.1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.

sonar.sources=.
sonar.sources.inclusions=**/**.php
sonar.exclusions=**/tests/**, docs/**, **/static/**, vendor/**
# Language
sonar.language=php

sonar.scm.provider=git

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Coverage / Unit Tests
sonar.tests=./tests
sonar.test.inclusions=**/**Test.php
sonar.php.coverage.reportPaths=coverage.xml

# Ignora a regra que pede namespace em vez de require_once (projeto usa páginas PHP simples) e 
#  outras regras que não se aplicam ao projeto

sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S4833
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=**/php/LivroRepository.php
