services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_USER: pnld
      DB_PASSWORD: pnld_local
      DB_NAME: SistemaHBL
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local
      MYSQL_DATABASE: SistemaHBL
      MYSQL_USER: pnld
      MYSQL_PASSWORD: pnld_local
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./sql/bancoPNLD.sql:/docker-entrypoint-initdb.d/01-banco.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD=$$MYSQL_PASSWORD mysql
          --protocol=TCP -h 127.0.0.1
          -u$$MYSQL_USER $$MYSQL_DATABASE
          -e 'SELECT 1 FROM administrador LIMIT 1'
          > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  dados_mysql: